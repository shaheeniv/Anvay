{% extends "base.html" %}
{% block title %}Forgot Password — Anvay{% endblock %}
{% block content %}

  <div class="page-header">
    <h1>Forgot your password?</h1>
  </div>

  <p class="hint">
    Enter the email for your Anvay login and we'll send a link to set a
    new password.
  </p>

  <form class="entry-form" method="post" action="{{ url_for('forgot_password') }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus>

    <div class="form-actions">
      <button type="submit" class="button">Send reset link</button>
      <a class="cancel-link" href="{{ url_for('login') }}">Back to log in</a>
    </div>
  </form>

{% endblock %}
