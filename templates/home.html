{% extends "base.html" %}
{% block title %}Anvay{% endblock %}
{% block content %}

  <div class="page-header hero-header">
    <img src="{{ url_for('static', filename='logo-full.png') }}" alt="Anvay — Stories, Roots, Legacy" class="hero-logo">
  </div>

  <section class="family-box">
    <h2>What would you like to open?</h2>
    <div class="family-box-links">
      <a class="family-box-link" href="{{ url_for('dashboard') }}">
        <span class="family-box-name">Family Portal</span>
        <span class="family-box-cta">Videos, family tree, contributions &rarr;</span>
      </a>
      <a class="family-box-link" href="{{ url_for('books_index') }}">
        <span class="family-box-name">Legacy Books</span>
        <span class="family-box-cta">Take me to my Legacy Books &rarr;</span>
      </a>
    </div>
  </section>

{% endblock %}
